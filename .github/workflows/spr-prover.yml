name: spr-prover

on:
  pull_request:
    paths:
      - "clients/spr-prover/**"
      - ".github/workflows/spr-prover.yml"
  push:
    branches: [main]
    paths:
      - "clients/spr-prover/**"
      - ".github/workflows/spr-prover.yml"

permissions:
  contents: read

concurrency:
  group: spr-prover-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clients/spr-prover

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/spr-prover/package-lock.json
      # runtime.lock.json pins the zopro revision this client builds.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run test:node
        timeout-minutes: 10
      - run: npm run test:browser
        env:
          CHROME_NO_SANDBOX: "1"
      - uses: actions/cache@v5
        with:
          path: clients/spr-prover/target/chrome-for-testing
          key: spr-prover-chrome-${{ runner.os }}-${{ hashFiles('clients/spr-prover/scripts/test-packed-consumer.mjs') }}
      - run: npm run test:consumer
        env:
          CHROME_NO_SANDBOX: "1"
      - uses: actions/checkout@v6
        with:
          repository: helius-labs/zolana
          ref: 6bb4f7008294695ebe614f08affb215d4321a538
          path: target/protocol-sdk
      - name: Build the pinned protocol SDK
        working-directory: target/protocol-sdk/sdk-libs/ts
        run: |
          npm ci
          npm pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/protocol-sdk-pack.json"
      - name: Check wallet compatibility with the pinned SDK
        run: |
          archive="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$RUNNER_TEMP/protocol-sdk-pack.json")"
          npm install --no-save --package-lock=false "$RUNNER_TEMP/$archive"
          npm run typecheck --workspace @zolana/wallet-example
          npm test --workspace @zolana/wallet-example
          npm run build --workspace @zolana/wallet-example

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/spr-prover/package-lock.json
      - run: npm ci
      - run: bash scripts/check-upstream.sh

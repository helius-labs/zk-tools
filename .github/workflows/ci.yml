name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: zopro

jobs:
  xtask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zopro/xtask
      - run: cargo fmt --manifest-path xtask/Cargo.toml -- --check
      - run: cargo test --manifest-path xtask/Cargo.toml --locked
      - run: cargo clippy --manifest-path xtask/Cargo.toml --locked --all-targets -- -D warnings
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zopro
      - run: cargo test --workspace --release
  metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zopro
      # GPU tests skip without a GPU; the kernels still compile.
      - run: cargo test --workspace --release
      - run: cargo test --release -p zopro-core --features metal

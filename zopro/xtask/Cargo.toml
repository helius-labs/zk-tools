[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# Keep orchestration dependencies out of the prover's cross-compilation graph.
[workspace]

[dependencies]
libc = "0.2"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

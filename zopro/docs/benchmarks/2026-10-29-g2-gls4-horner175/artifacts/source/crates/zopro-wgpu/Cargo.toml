[package]
name = "zopro-wgpu"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Multi-scalar multiplication for zopro through wgpu: one WGSL kernel set for Vulkan, Metal and WebGPU"

[dependencies]
zopro-bn254 = { path = "../zopro-bn254" }
rayon = "1.10"
wgpu = "30"
log = "0.4"
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-time]
version = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[dev-dependencies]
env_logger = "0.11"

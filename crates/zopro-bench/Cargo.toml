[package]
name = "zopro-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Proves a dumped shape natively with zopro-core and times it"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"
log = "0.4"
zopro-core = { path = "../zopro-core" }
ark-bn254 = { path = "../zopro-core/ark-bn254" }
ark-ec = "0.5"
ark-ff = "0.5"
rand = "0.8"
zopro-wgpu = { path = "../zopro-wgpu" }
wgpu = "30"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
zopro-metal = { path = "../zopro-metal" }

[features]
# The MSMs on an Apple GPU.
metal = ["zopro-core/metal"]
# The MSMs through wgpu (G2 on the CPU).
wgpu = ["zopro-core/wgpu"]

[package]
name = "zopro-prover"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Zolana's Groth16 prover without gnark: a zopro key, a request, a verified proof"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ark-bn254 = { path = "../zopro-core/ark-bn254" }
ark-ff = { version = "0.5", default-features = false }
log = "0.4"
serde_json = "1"
zopro-core = { path = "../zopro-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"

[features]
metal = ["zopro-core/metal"]
wgpu = ["zopro-core/wgpu"]
trace = ["zopro-core/trace"]

[dev-dependencies]
ark-ff = "0.5"

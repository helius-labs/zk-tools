[package]
name = "ringil-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Proves a dumped shape natively with ringil-core and times it"

[dependencies]
ringil-core = { path = "../ringil-core" }
ark-bn254 = { path = "../ringil-core/ark-bn254" }
ark-ec = "0.5"
ark-ff = "0.5"
rand = "0.8"
ringil-wgpu = { path = "../ringil-wgpu" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
ringil-metal = { path = "../ringil-metal" }

[features]
# The MSMs on an Apple GPU.
metal = ["ringil-core/metal"]

[package]
name = "ringil-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Groth16 BN254 proving from key images: field arithmetic, MSM, FFT and witness solving, for wasm and native"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ark-bn254 = { path = "ark-bn254" }
ark-ec = { version = "0.5", features = ["parallel"] }
ark-ff = { version = "0.5", features = ["parallel"] }
ark-poly = { version = "0.5", features = ["parallel"] }
rayon = "1.10"
wasm-bindgen = "=0.2.128"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }

[features]
# Prints each proof stage's time to stderr (native only).
trace = []
# The MSMs on an Apple GPU (macOS, iOS); RINGIL_GPU=0 keeps them on the CPU.
metal = ["dep:ringil-metal"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false


[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
ringil-metal = { path = "../ringil-metal", optional = true }

[package]
name = "zopro-metal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Multi-scalar multiplication on Apple GPUs for zopro: the host sorts the buckets, Metal sums and reduces them"

[dependencies]
log = "0.4"
objc = "0.2"
zopro-bn254 = { path = "../zopro-bn254" }
rayon = "1.10"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
metal = "0.33"


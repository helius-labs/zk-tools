[package]
name = "spr-zk-gadgets"
version = "0.1.0"
description = "General-purpose gadgets for the zk circuit DSL: Poseidon, hash chains, membership, indexing and byte hashing."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]

[dependencies]
ark-bn254 = { version = "0.6" }
ark-ff = { version = "0.6" }
ark-r1cs-std = { version = "0.6", default-features = false, features = ["std"] }
light-poseidon = "0.5"
spr-zk-dsl = { workspace = true, features = ["circuit"] }

[features]
# Test-only: runs the unit suite's cross-checks that spawn circom and snarkjs.
external-tools = []

[dev-dependencies]
spr-hasher = { workspace = true }
ark-circom = { version = "0.6.0", default-features = false }
hex = { workspace = true }
num-bigint = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wasmer = { version = "6.1", default-features = false }
spr-zk-dsl = { workspace = true, features = ["test-support", "setup"] }

[lints.clippy]
disallowed_types = "allow"
